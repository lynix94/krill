# Krill TSDB Configuration

# Database Configuration
storage:
  bucket_duration: 1h

sampling:
  # Level 0: Raw data (mandatory)
  # Direct memory block to storage (high performance)
  - name: "raw"
    interval: 0s              # No aggregation, keep original data
    retention: 2d             # Keep raw data for 2 days
    storage:
      type: "badger"
      badger:
        path: "./data/raw"
        partitions: 8         # High parallelism for raw writes
        chunk_size: 10000

  # Level 1: 1-minute downsampling
  - name: "1m_summary"
    interval: 1m              # Aggregate every 1 minute
    retention: 30d            # Keep for 30 days
    storage:
      type: "badger"
      badger:
        path: "./data/ds_1m"
        partitions: 4         # Medium parallelism
        chunk_size: 10000
  
  # Level 2: 1-hour downsampling
  - name: "1h_summary"
    interval: 1h              # Aggregate every 1 hour
    retention: 3y             # Keep for 3 years
    storage:
      type: "badger"
      badger:
        path: "./data/ds_1h"
        partitions: 2         # Low parallelism for long-term data
        chunk_size: 10000
      
      # Example: Switch to ClickHouse for long-term storage
      # type: "clickhouse"
      # clickhouse:
      #   host: "localhost:9000"
      #   database: "tsdb"
      #   table: "metrics_1h"
      #   user: "default"
      #   password: ""
      #   batch_size: 10000


# Logging Configuration
logging:
  # Log level: debug, info, warn, error
  level: info
  
  # Log format: json, text
  format: text
  
  # Log to standard error instead of files
  logtostderr: true
  
  # Log file directory (empty = disabled, only used if logtostderr=false)
  log_dir: ""
  
  # Enable stack trace at specific file:line (e.g., "server.go:123")
  log_backtrace_at: ""
  
  # Buffer log messages at this level or lower (-1=no buffer, 0=INFO only)
  logbuflevel: -1
  
  # Create symbolic links to log files in this directory
  log_link: ""

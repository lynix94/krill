# Krill TSDB Scraper Configuration
# This file defines how to scrape metrics from Prometheus exporters

global:
  # Default scrape interval for all jobs
  scrape_interval: 5s
  
  # Default timeout for scrape requests
  scrape_timeout: 3s

# Scrape job configurations
scrape_configs:
  # Example: Node Exporter (system metrics)
  - job_name: 'node'
    scrape_interval: 30s
    metrics_path: '/metrics'
    metric_prefix: 'node'
    static_configs:
      - targets:
          - 'localhost:9100'
        labels:
          environment: 'production'
          datacenter: 'dc1'

  # Example: Prometheus itself (self-monitoring)
  - job_name: 'prometheus'
    scrape_interval: 15s
    metrics_path: '/metrics'
    metric_prefix: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

